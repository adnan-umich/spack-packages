# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
    install_tree:
      root: /sw/spack/opt/pkgs
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: R stacks
    specs:
    - matrix:
      - - rtidyverse@2.0.0_R4.5.3 ^r/w4z6lu4 ^meson/mydduah
        - rgeospatial@1.5-18_R4.5.3 ^r/w4z6lu4 ^libtiff@4.7.1 ^gdal/wj3bifx ^poppler@21.09.0 ^proj@9.7.0 ^geos@3.14.1 ^netcdf-fortran@4.6.2 ^hdf5@1.14.6 ^openjdk ^meson/mydduah
        - rtidyverse@2.0.0_R4.6.1 ^r/hsmq64i ^meson/mydduah
        - rgeospatial@1.5-18_R4.6.1 ^r/hsmq64i ^libtiff@4.7.1 ^gdal/wj3bifx ^poppler@21.09.0 ^proj@9.7.0 ^geos@3.14.1 ^netcdf-fortran@4.6.2 ^hdf5@1.14.6 ^openjdk ^meson/mydduah
        - r-seurat@5.5.1 ^r@4.6.1/hsmq64i ^r-reticulate@1.46.0 ^r-dotcall64@1.2
      - - '%c,cxx=gcc@14.3.1'
    override:
      packages:
        c:
          prefer: [gcc@14.3.1]
        cxx:
          prefer: [gcc@14.3.1]
        fortran:
          prefer: [gcc@14.3.1]
        python:
          require:
          - +arc
        openmpi:
          require:
          - +arc
        r:
          require:
          - +arc
        r-proxy:
          require: ['@0.4-29']
        r-rpart:
          require: ['@4.1.27']
        r-geometries:
          require: ['@0.2.5']
        r-zoo:
          require: ['@1.8-15']
        r-igraph:
          require: ['@2.3.3']
        r-spatstat-random:
          require: ['@3.5-1']
        r-maps:
          require: ['@3.4.3']
        r-jsonify:
          require: ['@1.2.3']
        r-s2:
          require: ['@1.1.12']
        r-rcpp:
          require: ['@1.1.0:']
        r-rapidjsonr:
          require: ['@1.2.1:']
        r-cpp11:
          require: ['@0.5.0:']
        gdal:
          require:
          - +blosc+arrow+hdf4+hdf5+liblzma+libxml2+poppler+parquet+libaec+zstd+webp+sfcgal+pcre2+lz4+deflate+avif+freexl+jxl+heif
          - spec: '@3.13.2+armadillo'
            when: '%gcc@10.3.0:'
        sfcgal:
          prefer:
          - +eigen
        arrow:
          require:
          - +brotli+bz2+csv+compute+dataset+filesystem+ipc+mimalloc~orc+parquet~python+shared~snappy+zlib+zstd
        json-c:
          prefer:
          - '@0.16'
        libheif:
          prefer:
          - ~gdk-plugin
        highway:
          prefer:
          - "@1.0.7"
        meson:
          prefer:
          - "/mydduah"
        curl:
          require:
          - "/zhvfjjx"
        r-curl^r@4.5.3:
          require:
          - "/rahzyli"
  concretizer:
    unify: false
    reuse: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/opt/modules
        tcl: /sw/spack/opt/modules
      lmod:
        projections:
          r: R/{version}
          hdf5~threadsafe: hdf5/{version}-nonatomic
          intel-oneapi-compilers-classic: intel/{version}
          miniforge3: mamba/{version}
          py-mpi4py: mpi4py/{version}
        hash_length: 0
        #hide_implicits: true
        core_compilers:
        - gcc@14.3.1
        hierarchy:
        - r
        - mpi
        core_specs:
        - gcc@14.3.1
        - gcc-runtime@14.3.1
        exclude:
        - gcc-runtime@14.3.1
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        - poppler-data
        gcc-runtime:
          template: gcc-runtime.lua
